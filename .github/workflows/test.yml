name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # 3.14.4 has no build for 26.04 in actions/python-versions
    strategy:
      matrix:
        python-version: ['3.12', '3.14.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the replay rebuilds the declaration's commit with git archive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q
      - name: pinned declaration, printed (the test asserts it; this shows what this runner saw)
        run: python tests/pinned_run/check_pinned_run.py
